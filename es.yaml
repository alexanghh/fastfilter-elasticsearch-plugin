apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elastic
spec:
  version: 8.5.0
  image: alexanghh/elasticsearch-8.5.0-roaringbitmap:latest
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: "1"  # Example: Request 1 CPU core
                  memory: 1Gi
                limits:
                  cpu: "1"  # Example: Limit to 2 CPU cores
                  memory: 1Gi
